set_last_scheduled_backwash:
  name: Set last scheduled backwash
  description: >
    Records when the unit last ran its scheduled backwash, so the "next
    scheduled backwash" projection can start without waiting a whole interval
    for the first cycle the integration observes itself. The device never
    transmits its backwash history, so this has to be entered by hand.

    The value is marked as manually entered (source: manual) on the
    "last scheduled backwash" sensor. The last write wins: a date entered here
    always applies, whatever was stored before, and a scheduled cycle detected
    afterwards replaces it in turn.
  fields:
    timestamp:
      name: Last scheduled backwash
      description: >
        When the scheduled backwash last ran. Must be in the past.
      required: true
      example: "2026-08-01 12:30:00"
      selector:
        datetime:
    serial_number:
      name: Serial number
      description: >
        Which device to set. Leave empty to set it on every Aseko device that
        has a backwash valve.
      required: false
      example: 110071590
      selector:
        number:
          mode: box
          min: 0
          step: 1

clear_last_scheduled_backwash:
  name: Clear last scheduled backwash
  description: >
    Forgets the last scheduled backwash, returning it to unknown. The undo for
    a mistyped date entered with set_last_scheduled_backwash.

    If the integration has an older backwash on record and no manual cycle has
    been observed, clearing this also re-derives the scheduled/manual split
    from that record on the next frame.
  fields:
    serial_number:
      name: Serial number
      description: >
        Which device to clear. Leave empty to clear it on every Aseko device
        that has a backwash valve.
      required: false
      example: 110071590
      selector:
        number:
          mode: box
          min: 0
          step: 1

reset_consumption:
  name: Reset consumption
  description: >
    Resets the chemical consumption counter(s) for one or all pumps.
    Use this after refilling a canister to start tracking from zero again.
  fields:
    pump:
      name: Pump
      description: >
        Which pump to reset. Use "all" to reset every pump at once.
      required: false
      default: all
      example: cl
      selector:
        select:
          options:
            - all
            - cl
            - ph_minus
            - ph_plus
            - algicide
            - floc
            - oxy
    counter:
      name: Counter
      description: >
        Which counter to reset. "canister" (since last refill), "total"
        (lifetime), or "all" (both).
      required: false
      default: canister
      example: canister
      selector:
        select:
          options:
            - canister
            - total
            - all
    serial_number:
      name: Serial number
      description: >
        Reset only this unit. Leave empty to reset every unit.
      required: false
      example: 110071590
      selector:
        number:
          min: 1
          mode: box

mark_dump:
  name: Mark dump
  description: >
    Writes a numbered, timestamped marker into the frame log that the
    diagnostics download carries. Call it (e.g. from a dashboard button on
    your phone), then photograph the unit's display straight away: the marker
    sits between the frames received before and after, so frames and photos
    line up without comparing clocks. The test cases card calls it for you and
    stores the photos too. The response returns the marker number.
  fields:
    note:
      name: Note
      description: >
        Optional short text stored with the marker, e.g. what you just changed
        on the unit.
      required: false
      example: "Heating control ON"
      selector:
        text:
    wait_for_next_frame:
      name: Wait for the next frame
      description: >
        Write the marker only once the next whole frame has arrived (at most 60
        seconds). Change the setting on the unit, call this, and the marker
        lands right after the first frame that can carry the change -- a unit
        with its settings menu open sends nothing until the menu is closed.
        Either way the marker records how many seconds ago each unit's last
        frame arrived.
      required: false
      default: true
      selector:
        boolean:
    serial_number:
      name: Serial number
      description: >
        Wait for a frame from this unit only, when several units send to the
        same entry. Without it a frame from any unit counts.
      required: false
      example: 110071590
      selector:
        number:
          min: 1
          max: 4294967295
          mode: box
